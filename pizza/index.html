<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Доска с пиццей</title>
<style>
  :root {
    --bg: #f3f3f4;
    --dot: #d6d7db;
    --panel: #ffffff;
    --fg: #1e1f24;
    --muted: #6d707a;
    --line: #e2e3e7;
    --accent: #3b5bdb;
    --accent-soft: #e7ecfc;
    --cheese: #fbe7b0;
    --crust: #9b7344;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181c;
      --dot: #2c2e35;
      --panel: #22242b;
      --fg: #eceef2;
      --muted: #9ba0ab;
      --line: #33363f;
      --accent: #7b96f0;
      --accent-soft: #29324f;
      --cheese: #8a6f3d;
      --crust: #c49a5e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181c;
    --dot: #2c2e35;
    --panel: #22242b;
    --fg: #eceef2;
    --muted: #9ba0ab;
    --line: #33363f;
    --accent: #7b96f0;
    --accent-soft: #29324f;
    --cheese: #8a6f3d;
    --crust: #c49a5e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .board {
    position: relative;
    width: 100%;
    height: 100%;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  .panel {
    position: absolute;
    background: var(--panel);
    border: 0.5px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    z-index: 2;
  }
  .title {
    top: max(16px, env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    font-size: 15px; font-weight: 500;
  }
  .title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .actions {
    top: max(16px, env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; gap: 4px;
    padding: 6px;
  }
  .tools {
    left: max(16px, env(safe-area-inset-left, 0px));
    top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 4px;
    padding: 6px;
  }
  .sep { height: 0.5px; background: var(--line); margin: 4px 6px; }
  button {
    font: inherit;
    color: var(--fg);
    background: transparent;
    border: 0;
    border-radius: 8px;
    min-width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 8px;
    cursor: pointer;
  }
  button:hover { background: var(--bg); }
  button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  button.text { font-size: 13px; }
  .seg { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 2px; }
  .seg button { min-width: 34px; height: 30px; font-size: 13px; }
  .colors { display: flex; gap: 6px; padding: 0 4px; }
  .colors button { min-width: 0; width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .colors button[aria-pressed="true"] { border-color: var(--fg); background-clip: padding-box; }
  .history {
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: max(16px, env(safe-area-inset-bottom, 0px));
    display: flex; gap: 4px; padding: 6px;
  }
  .readout {
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    padding: 8px 16px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    font-size: 15px;
  }
  .readout .muted { color: var(--muted); font-size: 13px; margin-left: 8px; }
  @media (max-width: 640px) {
    .title span.hide-sm { display: none; }
    .readout { white-space: normal; text-align: center; max-width: calc(100% - 32px); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="board">
  <canvas id="cv" aria-label="Доска: рисуй, ставь пиццу и закрашивай куски"></canvas>

  <div class="panel title">
    <span class="dot" aria-hidden="true"></span>
    <span>Доска с пиццей</span>
  </div>

  <div class="panel actions" role="group" aria-label="Размер пиццы и очистка">
    <span class="seg" role="group" aria-label="Кусков в пицце">
      <button data-n="4" class="text">4</button>
      <button data-n="6" class="text">6</button>
      <button data-n="8" class="text" aria-pressed="true">8</button>
      <button data-n="12" class="text">12</button>
    </span>
    <button id="clear" class="text">Очистить</button>
  </div>

  <div class="panel tools" role="toolbar" aria-label="Инструменты" aria-orientation="vertical">
    <button data-tool="pen" aria-pressed="true" aria-label="Карандаш" title="Карандаш">
      <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>
    </button>
    <button data-tool="erase" aria-pressed="false" aria-label="Ластик" title="Ластик">
      <svg viewBox="0 0 24 24"><path d="M3 15l8-8 7 7-5 5H7z"/><path d="M9 21h12"/></svg>
    </button>
    <div class="sep"></div>
    <button data-tool="pizza" aria-pressed="false" aria-label="Поставить пиццу" title="Поставить пиццу">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 12V3M12 12l7.8 4.5M12 12l-7.8 4.5"/></svg>
    </button>
    <button data-tool="fill" aria-pressed="false" aria-label="Закрасить кусок" title="Закрасить кусок">
      <svg viewBox="0 0 24 24"><path d="M12 3L3 12l7 7 9-9z"/><path d="M14.5 5.5l4 4"/></svg>
    </button>
    <div class="sep"></div>
    <div class="colors" role="group" aria-label="Цвет">
      <button data-color="#3b5bdb" aria-pressed="true" aria-label="Синий" style="background:#3b5bdb"></button>
      <button data-color="#e03131" aria-pressed="false" aria-label="Красный" style="background:#e03131"></button>
      <button data-color="#2f9e44" aria-pressed="false" aria-label="Зелёный" style="background:#2f9e44"></button>
      <button data-color="#f08c00" aria-pressed="false" aria-label="Оранжевый" style="background:#f08c00"></button>
      <button data-color="#1e1f24" aria-pressed="false" aria-label="Чёрный" style="background:#1e1f24"></button>
    </div>
  </div>

  <div class="panel history" role="group" aria-label="История">
    <button id="undo" aria-label="Отменить" title="Отменить">
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
    </button>
    <button id="redo" aria-label="Вернуть" title="Вернуть">
      <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
    </button>
  </div>

  <div class="panel readout" id="readout" aria-live="polite">
    <span id="frac">Поставь пиццу</span><span class="muted" id="hint">выбери инструмент справа</span>
  </div>
</div>

<script>
(function () {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let dpr = 1;

  let objs = [];      // strokes and pizzas, drawn in order
  let undoStack = [];
  let redoStack = [];
  let tool = 'pen';
  let color = '#3b5bdb';
  let n = 8;
  let last = null;    // last pizza touched
  let drawing = null; // active stroke or erase gesture

  const PIZZA_R = 120;

  function cloneState(s) { return JSON.stringify(s); }
  function pushHistory() {
    undoStack.push(cloneState(objs));
    if (undoStack.length > 100) undoStack.shift();
    redoStack = [];
  }

  function resize() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function css(name, fb) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fb;
  }

  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const crust = css('--crust', '#9b7344');
    const cheese = css('--cheese', '#fbe7b0');
    for (const o of objs) {
      if (o.type === 'stroke') {
        if (o.pts.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(o.pts[0][0], o.pts[0][1]);
        for (let k = 1; k < o.pts.length; k++) ctx.lineTo(o.pts[k][0], o.pts[k][1]);
        ctx.strokeStyle = o.color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      } else if (o.type === 'pizza') {
        const seg = 2 * Math.PI / o.n;
        for (let i = 0; i < o.n; i++) {
          const a0 = -Math.PI / 2 + i * seg, a1 = a0 + seg;
          ctx.beginPath();
          ctx.moveTo(o.x, o.y);
          ctx.arc(o.x, o.y, o.r, a0, a1);
          ctx.closePath();
          ctx.fillStyle = cheese;
          ctx.fill();
          if (o.fills[i]) {
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = o.fills[i];
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          ctx.strokeStyle = crust;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r, 0, 2 * Math.PI);
        ctx.strokeStyle = crust;
        ctx.lineWidth = 5;
        ctx.stroke();
      }
    }
    updateReadout();
  }

  function pos(e) {
    const r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  function pizzaAt(x, y) {
    for (let k = objs.length - 1; k >= 0; k--) {
      const o = objs[k];
      if (o.type === 'pizza' && Math.hypot(x - o.x, y - o.y) <= o.r) return o;
    }
    return null;
  }

  function sliceOf(o, x, y) {
    let a = Math.atan2(y - o.y, x - o.x) + Math.PI / 2;
    if (a < 0) a += 2 * Math.PI;
    return Math.floor(a / (2 * Math.PI / o.n)) % o.n;
  }

  function eraseAt(x, y) {
    let changed = false;
    objs = objs.filter(function (o) {
      if (o.type === 'stroke') {
        const hit = o.pts.some(function (p) { return Math.hypot(p[0] - x, p[1] - y) < 14; });
        if (hit) { changed = true; return false; }
      } else if (o.type === 'pizza') {
        if (Math.hypot(x - o.x, y - o.y) <= o.r) { changed = true; return false; }
      }
      return true;
    });
    if (changed) draw();
  }

  function gcd(a, b) { return b ? gcd(b, a % b) : a; }

  function updateReadout() {
    const frac = document.getElementById('frac');
    const hint = document.getElementById('hint');
    if (!last || objs.indexOf(last) < 0) {
      frac.textContent = 'Поставь пиццу';
      hint.textContent = 'выбери инструмент справа';
      return;
    }
    const k = Object.keys(last.fills).length;
    const total = last.n;
    if (k === 0) {
      frac.textContent = '0/' + total;
      hint.textContent = 'закрась куски инструментом «Закрасить кусок»';
    } else if (k === total) {
      frac.textContent = '1 (вся пицца)';
      hint.textContent = '';
    } else {
      const g = gcd(k, total);
      frac.textContent = (k / g) + '/' + (total / g);
      hint.textContent = (g > 1 ? '(' + k + '/' + total + ')  ' : '') + '≈ ' + (Math.round(k / total * 1000) / 1000).toString().replace('.', ',');
    }
  }

  function setTool(t) {
    tool = t;
    document.querySelectorAll('[data-tool]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.tool === t));
    });
    cv.style.cursor = t === 'pizza' || t === 'fill' ? 'pointer' : (t === 'erase' ? 'cell' : 'crosshair');
  }

  cv.addEventListener('pointerdown', function (e) {
    const p = pos(e);
    const x = p[0], y = p[1];
    if (tool === 'pizza') {
      pushHistory();
      const pz = { type: 'pizza', x: x, y: y, r: PIZZA_R, n: n, fills: {} };
      objs.push(pz);
      last = pz;
      draw();
      return;
    }
    if (tool === 'fill') {
      const pz = pizzaAt(x, y);
      if (!pz) return;
      pushHistory();
      const i = sliceOf(pz, x, y);
      if (pz.fills[i]) delete pz.fills[i]; else pz.fills[i] = color;
      last = pz;
      draw();
      return;
    }
    if (tool === 'erase') {
      pushHistory();
      drawing = { erase: true };
      cv.setPointerCapture(e.pointerId);
      eraseAt(x, y);
      return;
    }
    pushHistory();
    drawing = { type: 'stroke', pts: [p], color: color, w: 3 };
    objs.push(drawing);
    cv.setPointerCapture(e.pointerId);
    draw();
  });

  cv.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    const p = pos(e);
    if (drawing.erase) { eraseAt(p[0], p[1]); return; }
    drawing.pts.push(p);
    draw();
  });

  function endDrawing() { drawing = null; }
  cv.addEventListener('pointerup', endDrawing);
  cv.addEventListener('pointercancel', endDrawing);

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(cloneState(objs));
    objs = JSON.parse(undoStack.pop());
    if (last && objs.indexOf(last) < 0) last = null;
    draw();
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(cloneState(objs));
    objs = JSON.parse(redoStack.pop());
    if (last && objs.indexOf(last) < 0) last = null;
    draw();
  }
  function clearAll() {
    if (!objs.length) return;
    pushHistory();
    objs = [];
    last = null;
    draw();
  }

  document.querySelectorAll('[data-tool]').forEach(function (b) {
    b.addEventListener('click', function () { setTool(b.dataset.tool); });
  });
  document.querySelectorAll('[data-color]').forEach(function (b) {
    b.addEventListener('click', function () {
      color = b.dataset.color;
      document.querySelectorAll('[data-color]').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      if (tool === 'erase' || tool === 'pizza') setTool('pen');
    });
  });
  document.querySelectorAll('[data-n]').forEach(function (b) {
    b.addEventListener('click', function () {
      n = Number(b.dataset.n);
      document.querySelectorAll('[data-n]').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      setTool('pizza');
    });
  });
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('redo').addEventListener('click', redo);
  document.getElementById('clear').addEventListener('click', clearAll);

  window.addEventListener('resize', resize);
  window.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  });

  document.querySelector('[data-n="8"]').setAttribute('aria-pressed', 'true');
  setTool('pen');
  resize();
})();
</script>
</body>
</html>
